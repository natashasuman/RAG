version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: financial_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_rag_api
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=financial_filings
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
